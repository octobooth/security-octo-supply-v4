name: "Verify Container Attestations"
description: "Verifies build provenance and SBOM attestations for container images"

inputs:
  containers:
    description: 'JSON array of container images to verify (e.g., ["image1", "image2"])'
    required: true
  repository:
    description: "Repository to verify attestations against"
    required: true
  gh-token:
    description: "GitHub token for attestation verification"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set GitHub Hostname
      id: set-hostname
      shell: bash
      run: |
        # Extract hostname by removing https:// prefix (GitHub always uses HTTPS)
        hostname="${{ github.server_url }}"
        hostname="${hostname#https://}"
        echo "hostname=$hostname" >> $GITHUB_OUTPUT
        echo "🌐 GitHub hostname: $hostname"

    - name: Verify Build Provenance Attestations
      id: provenance
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        VERIFICATION_TYPE: "🏗️ build provenance"
        GH_HOSTNAME: ${{ steps.set-hostname.outputs.hostname }}
        ATTESTATION_REPOSITORY: ${{ inputs.repository }}
        CONTAINERS: ${{ inputs.containers }}
      run: |
        echo "$VERIFICATION_TYPE verification started..."
        containers=$(jq -er 'if type == "array" and length > 0 and all(.[]; type == "string" and length > 0) then .[] else error("Expected nonempty container array") end' <<< "$CONTAINERS")
        all_passed=true

        while IFS= read -r container; do
          echo ""
          echo "📦 Verifying $VERIFICATION_TYPE for: $container"
          if gh attestation verify "oci://$container" \
            --hostname "$GH_HOSTNAME" \
            --repo "$ATTESTATION_REPOSITORY" \
            --signer-workflow "$ATTESTATION_REPOSITORY/.github/workflows/build-publish-containers.yml"; then
            echo "✅ $VERIFICATION_TYPE verified for $container"
          else
            echo "❌ $VERIFICATION_TYPE verification failed for $container"
            all_passed=false
          fi
        done <<< "$containers"

        echo "VERIFICATION_PASSED=$all_passed" >> $GITHUB_OUTPUT
        echo ""
        echo "$VERIFICATION_TYPE verification completed"

    - name: Verify SBOM Attestations
      id: sbom
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        VERIFICATION_TYPE: "📋 SBOM"
        GH_HOSTNAME: ${{ steps.set-hostname.outputs.hostname }}
        ATTESTATION_REPOSITORY: ${{ inputs.repository }}
        CONTAINERS: ${{ inputs.containers }}
      run: |
        echo "$VERIFICATION_TYPE verification started..."
        containers=$(jq -er 'if type == "array" and length > 0 and all(.[]; type == "string" and length > 0) then .[] else error("Expected nonempty container array") end' <<< "$CONTAINERS")
        all_passed=true

        while IFS= read -r container; do
          echo ""
          echo "📦 Verifying $VERIFICATION_TYPE for: $container"
          if gh attestation verify "oci://$container" \
            --hostname "$GH_HOSTNAME" \
            --repo "$ATTESTATION_REPOSITORY" \
            --signer-workflow "$ATTESTATION_REPOSITORY/.github/workflows/build-publish-containers.yml" \
            --predicate-type https://spdx.dev/Document/v2.3; then
            echo "✅ $VERIFICATION_TYPE verified for $container"
          else
            echo "❌ $VERIFICATION_TYPE verification failed for $container"
            all_passed=false
          fi
        done <<< "$containers"

        echo "VERIFICATION_PASSED=$all_passed" >> $GITHUB_OUTPUT
        echo ""
        echo "$VERIFICATION_TYPE verification completed"

    - name: Generate Summary Report
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        GH_HOSTNAME: ${{ env.GH_HOSTNAME }}
      with:
        github-token: ${{ inputs.gh-token }}
        script: |
          console.log("📊 Generating verification summary report...");

          const containers = JSON.parse('${{ inputs.containers }}');
          const provenancePassed = '${{ steps.provenance.outputs.VERIFICATION_PASSED }}' === 'true';
          const sbomPassed = '${{ steps.sbom.outputs.VERIFICATION_PASSED }}' === 'true';

          const allPassed = provenancePassed && sbomPassed;
          const hostname = '${{ steps.set-hostname.outputs.hostname }}';
          const workflowUrl = `https://${hostname}/${{ inputs.repository }}/blob/main/.github/workflows/build-publish-containers.yml`;

          // Build summary report
          let summary = `# 🔍 Container Attestation Verification Report

          **Approved Workflow**: [build-publish-containers.yml](${workflowUrl})

          | Container Image | Provenance | SBOM | Status |
          |----------------|------------|------|--------|
          `;

          // Add rows for each container
          containers.forEach(container => {
            const containerLink = `[${container}](https://${container})`;
            const provenanceIcon = provenancePassed ? '✅' : '❌';
            const sbomIcon = sbomPassed ? '✅' : '❌';
            const statusIcon = allPassed ? '✅ Verified' : '❌ Failed';
            
            summary += `| ${containerLink} | ${provenanceIcon} | ${sbomIcon} | ${statusIcon} |\n`;
          });

          summary += '\n';

          // Add overall status
          if (allPassed) {
            summary += `## ✅ All Verifications Passed

            All container images have been successfully verified with:
            - ✅ **Build Provenance**: Verified build attestations
            - ✅ **SBOM**: Verified Software Bill of Materials
            `;
            console.log("🎉 All container attestations verified successfully!");
          } else {
            summary += `## ❌ Verification Failed

            One or more container attestations failed verification. Deployment should not proceed.

            `;
            
            if (!provenancePassed) summary += '- ❌ **Build Provenance**: Failed to verify build attestations\n';
            if (!sbomPassed) summary += '- ❌ **SBOM**: Failed to verify Software Bill of Materials\n';
            
            console.log("❌ Container attestation verification failed!");
            core.setFailed("Container attestation verification failed!");
          }

          await core.summary.addRaw(summary).write();
